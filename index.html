<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramoccg - Juego</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 50px; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { color: #ccc; max-width: 600px; margin: 0 auto 30px; line-height: 1.6; }
        .botones { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
        .btn { padding: 15px 30px; background: #007bff; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .caracteristicas { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 10px; width: 250px; }
    </style>
</head>
<body>
    <h1>Nombre de tu Juego</h1>
    <p>Una breve descripción épica de tu juego. ¡Pronto disponible en todas las plataformas!</p>

    <div class="botones">
        <a href="ENLACE_STEAM" class="btn">Steam</a>
        <a href="ENLACE_APPSTORE" class="btn">App Store</a>
        <a href="ENLACE_PLAYSTORE" class="btn">Google Play</a>
    </div>

    <div class="caracteristicas">
        <div class="card"><h3>Gráficos</h3><p>Impresionantes visuales.</p></div>
        <div class="card"><h3>Jugabilidad</h3><p>Adictiva y desafiante.</p></div>
        <div class="card"><h3>Multijugador</h3><p>Juega con amigos.</p></div>
    </div>
</body>
</html>
